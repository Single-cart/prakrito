name: Repository Sync

on:
  push:
    branches:
      - sync

jobs:
  sync-repositories:
    # Only run on the singlecart-core repository
    if: ${{ github.repository == 'Single-cart/singlecart-core' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name 'Md Taifur'
          git config --global user.email 'taifurislamashraf@gmail.com'

      - name: Sync to target repositories
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # List of target repositories to sync with
          TARGET_REPOS=(
            "inbej"
            "fablura"
          )

          for REPO in "${TARGET_REPOS[@]}"; do
            echo "📦 Starting sync to $REPO"
            
            # Use the PAT token in the clone URL
            CLONE_URL="https://$GH_TOKEN@github.com/Single-cart/${REPO}.git"
            
            if git clone "$CLONE_URL" "target_repo_${REPO}" 2>/dev/null; then
              cd "target_repo_${REPO}"
              
              # Create or switch to sync branch
              if git checkout sync 2>/dev/null || git checkout -b sync; then
                # Add source remote using PAT
                SOURCE_URL="https://$GH_TOKEN@github.com/Single-cart/singlecart-core.git"
                git remote add source "$SOURCE_URL" || git remote set-url source "$SOURCE_URL"
                
                # Fetch from source
                if git fetch source sync; then
                  # Find the common ancestor (if any)
                  COMMON_ANCESTOR=$(git merge-base HEAD source/sync 2>/dev/null || echo "")
                  
                  if [ -n "$COMMON_ANCESTOR" ]; then
                    echo "Common ancestor found. Getting changed files only..."
                    
                    # Get list of files changed in source since common ancestor
                    CHANGED_FILES=$(git diff --name-only $COMMON_ANCESTOR source/sync)
                    
                    # If there are changed files, checkout only those files
                    if [ -n "$CHANGED_FILES" ]; then
                      echo "Changes detected. Checking out modified files..."
                      echo "$CHANGED_FILES" | while read FILE; do
                        if [ -n "$FILE" ]; then
                          echo "Updating: $FILE"
                          git checkout source/sync -- "$FILE" || echo "Failed to checkout $FILE"
                        fi
                      done
                      
                      # Commit and push changes
                      if [ -n "$(git status --porcelain)" ]; then
                        git add .
                        git commit -m "Sync: Updated changed files from singlecart-core"
                        git push origin sync
                        echo "✅ Successfully pushed changes to $REPO"
                      else
                        echo "No changes to commit for $REPO"
                      fi
                    else
                      echo "No changes detected since last sync"
                    fi
                  else
                    echo "No common history found. Performing initial full sync..."
                    
                    # For initial sync, checkout all files from source
                    git checkout source/sync -- .
                    
                    # Commit and push changes
                    if [ -n "$(git status --porcelain)" ]; then
                      git add .
                      git commit -m "Sync: Initial full sync from singlecart-core"
                      git push origin sync
                      echo "✅ Successfully pushed initial sync to $REPO"
                    else
                      echo "No changes to commit for $REPO"
                    fi
                  fi
                else
                  echo "❌ Failed to fetch from source for $REPO"
                fi
              else
                echo "❌ Failed to create/switch to sync branch in $REPO"
              fi
              
              cd ..
              rm -rf "target_repo_${REPO}"
            else
              echo "❌ Failed to clone $REPO"
            fi
          done

          echo "💯 Sync process completed!"
