name: Sync Multiple Repositories

on:
  push:
    branches:
      - sync

jobs:
  sync-repositories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name 'Md Taifur'
          git config --global user.email 'taifurislamashraf@gmail.com'

      - name: Sync to target repositories
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # List of target repositories to sync with
          TARGET_REPOS=(
            "inbej"
            "fablura"
          )

          for REPO in "${TARGET_REPOS[@]}"; do
            echo "📦 Starting sync to $REPO"
            
            # Use the PAT token in the clone URL
            CLONE_URL="https://$GH_TOKEN@github.com/Single-cart/${REPO}.git"
            
            if git clone "$CLONE_URL" "target_repo_${REPO}" 2>/dev/null; then
              cd "target_repo_${REPO}"
              
              # Create or switch to sync branch
              if git checkout sync 2>/dev/null || git checkout -b sync; then
                # Add source remote using PAT
                SOURCE_URL="https://$GH_TOKEN@github.com/Single-cart/${GITHUB_REPOSITORY#*/}.git"
                git remote add source "$SOURCE_URL"
                
                # Try to merge, but if there's a conflict, handle it with strategy
                if git fetch source sync; then
                  # Option 1: Try merge with ours strategy (prefer target repo's changes)
                  if git merge -X ours source/sync -m "Sync: Merging updates from source repository (keeping our changes for conflicts)"; then
                    echo "✅ Successfully merged with strategy 'ours' for $REPO"
                  # Option 2: If that fails, try getting list of conflicted files and resolving manually
                  else
                    echo "⚠️ Merge conflicts detected, attempting to resolve..."
                    
                    # Abort the failed merge
                    git merge --abort
                    
                    # Try theirs strategy instead (prefer source repo's changes)
                    if git merge -X theirs source/sync -m "Sync: Merging updates from source repository (using source changes for conflicts)"; then
                      echo "✅ Successfully merged with strategy 'theirs' for $REPO"
                    else
                      echo "❌ Unable to automatically resolve conflicts in $REPO"
                      exit 1
                    fi
                  fi
                  
                  # Push the changes
                  if git push origin sync; then
                    echo "✅ Successfully pushed changes to $REPO"
                  else
                    echo "❌ Failed to push changes to $REPO"
                    exit 1
                  fi
                else
                  echo "❌ Failed to fetch from source for $REPO"
                  exit 1
                fi
              else
                echo "❌ Failed to create/switch to sync branch in $REPO"
                exit 1
              fi
              
              cd ..
              rm -rf "target_repo_${REPO}"
            else
              echo "❌ Failed to clone $REPO"
              exit 1
            fi
          done
