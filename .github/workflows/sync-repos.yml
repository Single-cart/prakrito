name: Sync Multiple Repositories

on:
  push:
    branches:
      - sync

jobs:
  sync-repositories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name 'Md Taifur'
          git config --global user.email 'taifurislamashraf@gmail.com'

      - name: Sync to target repositories
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # List of target repositories to sync with
          TARGET_REPOS=(
            "inbej"
            "fablura"
          )

          # Get the current repository name
          CURRENT_REPO=${GITHUB_REPOSITORY#*/}
          echo "Current repository: $CURRENT_REPO"

          for REPO in "${TARGET_REPOS[@]}"; do
            echo "📦 Starting sync to $REPO"
            
            # Use the PAT token in the clone URL
            CLONE_URL="https://$GH_TOKEN@github.com/Single-cart/${REPO}.git"
            
            if git clone "$CLONE_URL" "target_repo_${REPO}" 2>/dev/null; then
              cd "target_repo_${REPO}"
              
              # Create or switch to sync branch
              if git checkout sync 2>/dev/null || git checkout -b sync; then
                # Add source remote using PAT
                SOURCE_URL="https://$GH_TOKEN@github.com/Single-cart/${CURRENT_REPO}.git"
                git remote add source "$SOURCE_URL"
                
                # Fetch from source
                if git fetch source sync; then
                  echo "Attempting merge with --allow-unrelated-histories..."
                  
                  # Try merge with allow-unrelated-histories
                  if git merge --allow-unrelated-histories source/sync -m "Sync: Merging updates from source repository"; then
                    echo "✅ Successfully merged from source for $REPO"
                  else
                    echo "⚠️ Merge conflicts detected, attempting to resolve with -X theirs strategy..."
                    # Clean up failed merge
                    git merge --abort || true
                    
                    # Try again with theirs strategy and allow-unrelated-histories
                    if git merge --allow-unrelated-histories -X theirs source/sync -m "Sync: Merging updates from source (using source changes for conflicts)"; then
                      echo "✅ Successfully merged using 'theirs' strategy for $REPO"
                    else
                      echo "❌ Failed to automatically resolve conflicts in $REPO"
                      git merge --abort || true
                      cd ..
                      rm -rf "target_repo_${REPO}"
                      # Continue to next repo instead of exiting
                      continue
                    fi
                  fi
                  
                  # Push the changes
                  if git push origin sync; then
                    echo "✅ Successfully pushed changes to $REPO"
                  else
                    echo "❌ Failed to push changes to $REPO"
                    # Continue to next repo instead of exiting
                    cd ..
                    rm -rf "target_repo_${REPO}"
                    continue
                  fi
                else
                  echo "❌ Failed to fetch from source for $REPO"
                  cd ..
                  rm -rf "target_repo_${REPO}"
                  continue
                fi
              else
                echo "❌ Failed to create/switch to sync branch in $REPO"
                cd ..
                rm -rf "target_repo_${REPO}"
                continue
              fi
              
              cd ..
              rm -rf "target_repo_${REPO}"
            else
              echo "❌ Failed to clone $REPO"
              continue
            fi
          done

          echo "💯 Sync process completed!"
